<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หน้าแนะนำตัวของฉัน</title>
<style>
body {
  background-color: #001C71; /* สีน้ำเงินประจำมหาวิทยาลัยมหิดล */
  color: #333;
  text-align: center; 
  padding: 50px 15px;
  font-family: sans-serif;
}
.card {
  background: white; 
  border-radius: 30px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  max-width: 500px; 
  margin: 0 auto; 
  padding: 30px;
}

/* สไตล์รูปโปรไฟล์ */
.profile-img {
  width: 140px;
  height: 140px;
  border-radius: 50%; /* ทำรูปเป็นวงกลม */
  object-fit: cover; /* ปรับรูปภาพให้พอดีไม่เบี้ยว */
  border: 4px solid #FFC845; /* เส้นขอบสีทอง */
  margin: 15px auto;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  display: block;
}

h1 { color: #2c3e50; margin-bottom: 10px; font-size: 24px; }
p { font-size: 18px; line-height: 1.6; color: #555; }

/* สไตล์ปุ่มแฟ้มสะสมงาน */
.btn-portfolio {
  display: inline-block;
  background-color: #FFC845; /* สีทอง/เหลืองทองสไตล์มหิดล */
  color: #001C71; /* ตัวอักษรสีน้ำเงินเข้ม */
  padding: 12px 24px;
  text-decoration: none;
  border-radius: 25px;
  margin-top: 20px;
  font-weight: bold;
  font-size: 16px;
  transition: all 0.3s ease;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

.btn-portfolio:hover {
  background-color: #e6b33c;
  transform: translateY(-2px);
}
</style>
</head>
<body>

  <div class="card">
    <!-- รูปภาพโปรไฟล์ของคุณ -->
    <img src="img/poom.jpg" alt="รูปโปรไฟล์" class="profile-img">
    
    <h1>ธนภัฎ ภู่พูลเพียน</h1>
    <p>ยินดีต้อนรับสู่เว็บแนะนำตัวของผมครับ<br>คณะแพทยศาสตร์ มหาวิทยาลัยมหิดล</p>
    
    <!-- บรรทัดนี้คือปุ่มที่ใช้กดเพื่อเชื่อมต่อไปยังหน้า portfolio.html -->
    <a href="portfolio.html" class="btn-portfolio">ดู Portfolio ของฉัน 👉</a>
  </div>

</body>
</html>
