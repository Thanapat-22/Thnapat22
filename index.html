<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>หน้าแนะนำตัวของฉัน</title>
<style>
body {
background-color: #001C71; /* สีน้ำเงินประจำมหาวิทยาลัยมหิดล */
color: #333;
text-align: center; 
padding: 50px;
font-family: sans-serif;
}
.card {
background: white; 
border-radius: 30px;
box-shadow: 0 4px 8px rgba(0,0,0,0.1);
max-width: 500px; 
margin: 0 auto; 
padding: 30px;
}

/* สไตล์รูปโปรไฟล์ */
.profile-img {
width: 140px;
height: 140px;
border-radius: 50%; /* ทำรูปเป็นวงกลม */
object-fit: cover; /* ปรับรูปภาพให้พอดีไม่เบี้ยว */
border: 4px solid #FFC845; /* เส้นขอบสีทอง */
margin: 15px auto;
box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

h1 { color: #2c3e50; margin-bottom: 10px; }
p { font-size: 18px; line-height: 1.6; }

/* สไตล์ปุ่มแฟ้มสะสมงาน */
.btn-portfolio {
display: inline-block;
background-color: #FFC845; /* สีทอง/เหลืองทองสไตล์มหิดล */
color: #001C71; /* ตัวอักษรสีน้ำเงินเข้ม */
padding: 12px 24px;
text-decoration: none;
border-radius: 8px;
margin-top: 15px;
font-weight: bold;
transition: background-color 0.3s ease;
}

.btn-portfolio:hover {
background-color: #e5b33e; /* เปลี่ยนเฉดเล็กน้อยเมื่อนำเมาส์ไปชี้ */
}
</style>
</head>
<body>
<div class="card">
<h1>ยินดีต้อนรับสู่โปรไฟล์ของฉัน</h1>

<!-- รูปโปรไฟล์ย้ายมาอยู่ใต้ h1 เรียบร้อยครับ -->
<img src="profile.jpg" alt="รูปโปรไฟล์ของธนภัฎ" class="profile-img">

<p>สวัสดีครับ! ผมชื่อ <strong>ธนภัฎ (Thanapat)</strong></p>
<p>ขณะนี้กำลังศึกษา/สนใจด้าน Science & Math</p>
<p>นี่คือเว็บไซต์แรกของผมที่โฮสต์บน GitHub Pages!</p>
<a href="portfolio.html" class="btn-portfolio">👉 ดูแฟ้มสะสมงานของผม</a>
</div>
</body>
</html>
