<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแรก - TCAS PORTFOLIO</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Sarabun', sans-serif; 
            background-color: #0b1a28; 
            color: white; 
            padding: 20px 15px; 
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            width: 100%;
        }

        .top-badge-wrapper { text-align: center; margin-bottom: 15px; }
        .top-badge { 
            display: inline-block; 
            background: rgba(255, 255, 255, 0.08); 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            color: #a0c4e8; 
            padding: 4px 18px; 
            border-radius: 20px; 
            font-size: 0.75rem; 
            font-weight: 700; 
        }

        /* เมนูนำทาง */
        .nav-container { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; }
        .nav-item { background: #112536; border: 1px solid #1f3f5c; color: #a0c4e8; padding: 7px 15px; border-radius: 20px; font-size: 0.82rem; font-weight: 600; text-decoration: none; transition: 0.2s; }
        .nav-item:hover { background: #1a3850; color: #fff; }
        .nav-item.active { background: #007acc; border-color: #0099ff; color: #ffffff; }

        /* Card หลักตรงกลาง */
        .white-card { 
            background: #ffffff; 
            color: #333333; 
            border-radius: 16px; 
            padding: 40px 30px; 
            text-align: center; 
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ตรามหาลัย มุมขวาบน */
        .top-right-logo {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 65px;
            height: 65px;
            object-fit: contain;
        }

        /* รูปโปรไฟล์ */
        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #007acc;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0, 122, 204, 0.2);
        }

        .system-tag {
            background: #e8f4fc;
            color: #007acc;
            border: 1px solid #b3d8f2;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 12px;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: inline-block;
        }

        .white-card h1 {
            color: #0b1a28;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .white-card p {
            color: #555555;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* ปุ่มกดไปหน้าถัดไป */
        .btn-next {
            background: linear-gradient(135deg, #e5b869 0%, #b8863b 100%);
            color: #0b1a28;
            padding: 10px 32px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(184, 134, 59, 0.3);
        }
        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(184, 134, 59, 0.4);
        }

        @media (max-width: 600px) {
            .top-right-logo {
                position: static;
                margin-bottom: 15px;
                width: 55px;
                height: 55px;
            }
            .white-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-badge-wrapper"><div class="top-badge">TCAS PORTFOLIO</div></div>

    <!-- เมนูนำทาง -->
    <div class="nav-container">
        <a href="index.html" class="nav-item active">หน้าแรก</a>
        <a href="preface.html" class="nav-item">คำนำ</a>
        <a href="me.html" class="nav-item">ประวัติส่วนตัว</a>
        <a href="target.html" class="nav-item">คณะที่มุ่งหวัง</a>
        <a href="activities.html" class="nav-item">ผลงานและเกียรติบัตร</a>
        <a href="skills.html" class="nav-item">ความสามารถพิเศษ</a>
        <a href="contact.html" class="nav-item">ช่องทางการติดต่อ</a>
    </div>

    <!-- Card หลัก -->
    <div class="white-card">
        <!-- ตรามหาลัย มุมขวาบน -->
        <img src="img/IMG_7868.png" alt="ตรามหาวิทยาลัย" class="top-right-logo">

        <img src="img/poom.jpg" alt="รูปโปรไฟล์" class="profile-img">
        <div class="system-tag">SYSTEM INITIALIZED</div>
        <h1>ยินดีต้อนรับสู่เว็บไซต์ Portfolio</h1>
        <p>แฟ้มสะสมผลงานของ ธนภัฎ ภู่พูลเพียน</p>
        
        <a href="preface.html" class="btn-next">ไปหน้าต่อไป >></a>
    </div>
</div>

</body>
</html>
