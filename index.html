<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแรก - TCAS PORTFOLIO</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Sarabun', sans-serif; 
            background-color: #ffffff; 
            color: #333333; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* แถบ Navbar ด้านบนสุด */
        header {
            width: 100%;
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
        }

        .logo {
            font-weight: 700;
            color: #e69d00;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .nav-menu {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-link {
            text-decoration: none;
            color: #888888;
            font-size: 0.9rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: #e69d00;
        }

        .nav-link.active {
            color: #e69d00;
            background: #fff8e6;
            padding: 6px 16px;
            border-radius: 8px;
            border: 1px solid #ffe8b3;
        }

        /* ส่วนเนื้อหาตรงกลางหน้าจอ */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        /* กรอบรูปโปรไฟล์ทรงกลมขอบทอง */
        .profile-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3.5px solid #e69d00;
            box-shadow: 0 4px 20px rgba(230, 157, 0, 0.15);
        }

        .system-tag {
            color: #e69d00;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
        }

        h1 {
            color: #e69d00;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #aaaaaa;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        /* ปุ่มไปหน้าถัดไปสีทอง */
        .btn-next {
            background: #e69d00;
            color: #ffffff;
            padding: 10px 32px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 14px rgba(230, 157, 0, 0.3);
        }

        .btn-next:hover {
            background: #d48f00;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            header { 
                flex-direction: column; 
                gap: 15px; 
                padding: 15px; 
            }
            .nav-menu { 
                flex-wrap: wrap; 
                justify-content: center; 
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- แถบเมนูด้านบน -->
    <header>
        <div class="logo">TCAS // PORTFOLIO</div>
        <nav class="nav-menu">
            <a href="index.html" class="nav-link active">หน้าแรก</a>
            <a href="preface.html" class="nav-link">คำนำ</a>
            <a href="me.html" class="nav-link">ประวัติส่วนตัว</a>
            <a href="target.html" class="nav-link">คณะที่มุ่งหวัง</a>
            <a href="activities.html" class="nav-link">ผลงานและเกียรติบัตร</a>
            <a href="skills.html" class="nav-link">ความสามารถ</a>
            <a href="contact.html" class="nav-link">ติดต่อ</a>
        </nav>
    </header>

    <!-- ส่วนตรงกลาง -->
    <main>
        <div class="profile-wrapper">
            <img src="img/poom.jpg" alt="รูปโปรไฟล์" class="profile-img">
        </div>
        
        <div class="system-tag">SYSTEM INITIALIZED</div>
        <h1>ยินดีต้อนรับสู่เว็บไซต์ Portfolio</h1>
        <p class="subtitle">แฟ้มสะสมผลงานของ ธนภัฎ ภู่พูลเพียน</p>
        
        <a href="preface.html" class="btn-next">ไปหน้าต่อไป >></a>
    </main>

</body>
</html>
