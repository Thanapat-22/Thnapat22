<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแรก - TCAS PORTFOLIO</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Sarabun', sans-serif; 
            background-color: #0b1a28; 
            color: #ffffff; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* แถบ Navbar ด้านบนสุด */
        header {
            width: 100%;
            background: #112536;
            border-bottom: 1px solid #1a3850;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
        }

        .logo {
            font-weight: 700;
            color: #e5b869;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .nav-menu {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-link {
            text-decoration: none;
            color: #a0c4e8;
            font-size: 0.88rem;
            font-weight: 600;
            padding: 7px 16px;
            border-radius: 20px;
            transition: all 0.2s;
        }

        .nav-link:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }

        .nav-link.active {
            color: #ffffff;
            background: #007acc;
            border: 1px solid #0099ff;
        }

        /* ส่วนเนื้อหาตรงกลางหน้าจอ */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            text-align: center;
        }

        /* กรอบรูปโปรไฟล์ทรงกลมขอบทอง */
        .profile-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3.5px solid #e5b869;
            box-shadow: 0 4px 25px rgba(229, 184, 105, 0.25);
        }

        .system-tag {
            display: inline-block;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #a0c4e8;
            padding: 4px 18px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
        }

        h1 {
            color: #ffffff;
            font-size: 1.9rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #b0c4de;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        /* ปุ่มไปหน้าถัดไปสีทอง */
        .btn-next {
            background: linear-gradient(135deg, #e5b869 0%, #b8863b 100%);
            color: #0b1a28;
            padding: 10px 35px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(229, 184, 105, 0.3);
            display: inline-block;
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(229, 184, 105, 0.4);
        }

        @media (max-width: 768px) {
            header { 
                flex-direction: column; 
                gap: 15px; 
                padding: 15px; 
            }
            .nav-menu { 
                justify-content: center; 
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <!-- แถบเมนูด้านบน -->
    <header>
        <div class="logo">TCAS // PORTFOLIO</div>
        <nav class="nav-menu">
            <a href="index.html" class="nav-link active">หน้าแรก</a>
            <a href="preface.html" class="nav-link">คำนำ</a>
            <a href="me.html" class="nav-link">ประวัติส่วนตัว</a>
            <a href="target.html" class="nav-link">คณะที่มุ่งหวัง</a>
            <a href="activities.html" class="nav-link">ผลงานและเกียรติบัตร</a>
            <a href="skills.html" class="nav-link">ความสามารถ</a>
            <a href="contact.html" class="nav-link">ติดต่อ</a>
        </nav>
    </header>

    <!-- ส่วนตรงกลาง -->
    <main>
        <div class="profile-wrapper">
            <img src="img/poom.jpg" alt="รูปโปรไฟล์" class="profile-img">
        </div>
        
        <div class="system-tag">SYSTEM INITIALIZED</div>
        <h1>ยินดีต้อนรับสู่เว็บไซต์ Portfolio</h1>
        <p class="subtitle">แฟ้มสะสมผลงานของ ธนภัฎ ภู่พูลเพียน</p>
        
        <a href="preface.html" class="btn-next">ไปหน้าต่อไป >></a>
    </main>

</body>
</html>
