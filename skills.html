<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ความสามารถพิเศษ - ธนภัฎ ภู่พูลเพียน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Sarabun', sans-serif; background-color: #1D4F91; color: white; text-align: center; padding: 40px 20px; line-height: 1.6; }
.container { max-width: 800px; margin: 0 auto; }
.card { background: white; color: #333; padding: 25px; margin: 25px 0; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); text-align: left; }
.card h2 { color: #1D4F91; font-size: 1.3rem; margin-bottom: 15px; border-bottom: 2px solid #FFC845; padding-bottom: 8px; }
.skill-list { display: flex; flex-wrap: wrap; gap: 10px; list-style: none; margin-top: 10px; }
.skill-tag { background-color: #eef3f9; color: #1D4F91; padding: 8px 16px; border-radius: 20px; font-size: 0.95rem; font-weight: 600; border: 1px solid #cce0f5; }
.btn { display: inline-block; background: #FFC845; color: #1D4F91; padding: 12px 28px; text-decoration: none; border-radius: 8px; margin-top: 20px; font-weight: bold; transition: all 0.3s ease; }
.btn:hover { background: #e5b33e; transform: translateY(-2px); }
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2>💡 ความสามารถพิเศษและทักษะเฉพาะทาง</h2>
    <ul class="skill-list">
      <li class="skill-tag">🩺 การปฐมพยาบาลเบื้องต้น & CPR</li>
      <li class="skill-tag">🧬 ปฏิบัติการวิทยาศาสตร์/ชีววิทยา</li>
      <li class="skill-tag">💻 มีจิตอาสา</li>
      <li class="skill-tag">🤝 การรับฟังด้วยความเข้าใจ (Empathy)</li>
    </ul>
  </div>

  <a href="index.html" class="btn">⬅️ กลับหน้าแรก</a>
</div>

</body>
</html>
